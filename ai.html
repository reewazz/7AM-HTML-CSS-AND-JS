<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog Management Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#1f2937,#111827);
color:white;
min-height:100vh;

}

.container{

width:95%;
max-width:1400px;
margin:auto;
padding:30px;

}

header{

display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;

}

header h1{

font-size:32px;

}

button{

cursor:pointer;
border:none;
transition:.3s;

}

.addBtn{

background:#6366f1;
padding:12px 22px;
border-radius:10px;
color:white;
font-weight:600;

}

.addBtn:hover{

background:#4f46e5;
transform:translateY(-3px);

}

.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
margin-bottom:30px;

}

.card{

background:rgba(255,255,255,.08);
backdrop-filter:blur(12px);
padding:25px;
border-radius:15px;
transition:.4s;

}

.card:hover{

transform:translateY(-8px);
box-shadow:0 20px 30px rgba(0,0,0,.3);

}

.card h2{

font-size:40px;
margin-bottom:10px;

}

.search{

margin-bottom:25px;

}

.search input{

width:100%;
padding:15px;
border:none;
border-radius:10px;
font-size:16px;

}

.blogGrid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:25px;

}

.blog{

background:rgba(255,255,255,.08);
border-radius:15px;
overflow:hidden;
transition:.4s;
animation:fade .5s;

}

.blog:hover{

transform:translateY(-10px);

}

.blog img{

width:100%;
height:180px;
object-fit:cover;

}

.content{

padding:20px;

}

.content h3{

margin-bottom:10px;

}

.content p{

font-size:14px;
opacity:.8;
margin-bottom:20px;

}

.actions{

display:flex;
justify-content:space-between;

}

.like{

background:#ec4899;
padding:10px 18px;
color:white;
border-radius:8px;

}

.like:hover{

background:#db2777;

}

.delete{

background:#ef4444;
padding:10px 18px;
color:white;
border-radius:8px;

}

.delete:hover{

background:#dc2626;

}

.modal{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
display:none;
justify-content:center;
align-items:center;

}

.box{

background:white;
color:black;
padding:30px;
width:400px;
border-radius:15px;

}

.box input,.box textarea{

width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ddd;
border-radius:8px;

}

.box button{

width:100%;
background:#6366f1;
padding:12px;
color:white;
border-radius:8px;

}

.badge{

display:inline-block;
padding:5px 12px;
background:gold;
color:black;
border-radius:20px;
font-size:12px;
margin-bottom:10px;

}

@keyframes fade{

from{

opacity:0;
transform:translateY(20px);

}

to{

opacity:1;
transform:translateY(0);

}

}

</style>

</head>
<body>

<div class="container">

<header>

<h1>📝 Blog Dashboard</h1>

<button class="addBtn" onclick="openModal()">
+ New Blog
</button>

</header>

<div class="stats">

<div class="card">
<h2 id="totalBlogs">0</h2>
<p>Total Blogs</p>
</div>

<div class="card">
<h2 id="likes">0</h2>
<p>Total Likes</p>
</div>

<div class="card">
<h2>Admin</h2>
<p>Professional Dashboard</p>
</div>

</div>

<div class="search">

<input
type="text"
placeholder="Search blog..."
id="search"
onkeyup="searchBlog()">

</div>

<div class="blogGrid" id="blogGrid">

</div>

</div>

<div class="modal" id="modal">

<div class="box">

<h2>Add Blog</h2>

<input id="title" placeholder="Title">

<input id="image" placeholder="Image URL">

<textarea id="desc" rows="5" placeholder="Description"></textarea>

<button onclick="addBlog()">Publish</button>

</div>

</div>

<script>

let blogs=JSON.parse(localStorage.getItem("blogs"))||[
{

title:"Modern Web Design",
image:"https://picsum.photos/500/300?1",
desc:"Learn modern UI principles and interactive experiences.",
likes:0

},

{

title:"JavaScript Tips",
image:"https://picsum.photos/500/300?2",
desc:"Useful tricks every frontend developer should know.",
likes:0

}

];

function save(){

localStorage.setItem("blogs",JSON.stringify(blogs));

}

function render(){

let html="";
let totalLike=0;

blogs.forEach((b,i)=>{

totalLike+=b.likes;

html+=`

<div class="blog">

<img src="${b.image}">

<div class="content">

<span class="badge">Featured</span>

<h3>${b.title}</h3>

<p>${b.desc}</p>

<div class="actions">

<button class="like" onclick="like(${i})">
❤️ ${b.likes}
</button>

<button class="delete" onclick="removeBlog(${i})">
Delete
</button>

</div>

</div>

</div>

`;

});

document.getElementById("blogGrid").innerHTML=html;

document.getElementById("totalBlogs").innerHTML=blogs.length;

document.getElementById("likes").innerHTML=totalLike;

save();

}

function like(i){

blogs[i].likes++;
render();

}

function removeBlog(i){

blogs.splice(i,1);
render();

}

function openModal(){

modal.style.display="flex";

}

window.onclick=e=>{

if(e.target==modal)
modal.style.display="none";

}

function addBlog(){

let title=document.getElementById("title").value;

let image=document.getElementById("image").value;

let desc=document.getElementById("desc").value;

if(title==""||image==""||desc=="") return;

blogs.unshift({

title,image,desc,likes:0

});

render();

modal.style.display="none";

title.value="";
image.value="";
desc.value="";

}

function searchBlog(){

let value=search.value.toLowerCase();

let cards=document.querySelectorAll(".blog");

cards.forEach(card=>{

let text=card.innerText.toLowerCase();

card.style.display=text.includes(value)?"block":"none";

});

}

render();

</script>

</body>
</html>
